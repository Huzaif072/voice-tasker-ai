name: Staging E2E

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  authenticated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      PLAYWRIGHT_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      E2E_TEST_EMAIL: ${{ secrets.STAGING_E2E_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Require staging secrets
        shell: bash
        run: |
          test -n "$PLAYWRIGHT_BASE_URL" || { echo "Missing STAGING_BASE_URL"; exit 1; }
          test -n "$E2E_TEST_EMAIL" || { echo "Missing STAGING_E2E_EMAIL"; exit 1; }
          test -n "$E2E_TEST_PASSWORD" || { echo "Missing STAGING_E2E_PASSWORD"; exit 1; }
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run staging browser tests
        run: npm run test:e2e
      - name: Run staging production-mode browser tests
        run: npm run test:e2e:prod
